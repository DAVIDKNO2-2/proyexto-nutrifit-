<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="min-h-screen bg-gray-100 p-8">
        <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
            <h2 class="text-2xl font-bold mb-6">Búsqueda de Ejercicios</h2>
            <form action="/search" method="GET">
                <div class="flex">
                    <input type="text" name="query" class="w-full px-3 py-2 border rounded-l-lg" placeholder="Buscar ejercicios...">
                    <button type="submit" class="bg-red-500 text-white px-4 rounded-r-lg">Buscar</button>
                </div>
            </form>
            <div id="search-results" class="mt-8">
                <!-- Los resultados de la búsqueda se mostrarán aquí -->
            </div>
        </div>
    </div>
</body>
</html>
